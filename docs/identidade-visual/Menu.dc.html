          <div style="width: 100%; height: 100%; background: #F2D9A8; box-shadow: inset 3px 3px 0 #C9A066; display: flex; align-items: center; justify-content: center">

                <div style="position: absolute; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.outer}}">
                  <div style="position: absolute; inset: 2px; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.inner}}"></div>

<script type="text/x-dc" data-dc-script data-props='{"estrelas":{"editor":"int","default":2,"min":0,"max":3},"selos":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'caso' };
  }
  renderVals() {
    const EL = {
      C: { m: '#4A4F5C', d: '#1C1E25', l: '#8A90A0', s: 28 },
      H: { m: '#EDEBDD', d: '#6E6C5E', l: '#FFFFFF', s: 16 },
      O: { m: '#E0433A', d: '#5A0E10', l: '#FF9A8A', s: 26 },
      N: { m: '#3F6FE0', d: '#13245E', l: '#9FBEFF', s: 26 }
    };
    const build = (mol, k, extra) => {
      const atoms = mol.atoms.map(([e, x, y]) => {
        const c = EL[e], s = Math.round(c.s * k), h = Math.max(2, Math.round(s / 5));
        return {
          outer: `left:${x * k - s / 2}px;top:${y * k - s / 2}px;width:${s}px;height:${s}px;background:${c.d}`,
          inner: `background:${c.m}`,
          hi: `left:${Math.round(s * 0.24)}px;top:${Math.round(s * 0.24)}px;width:${h}px;height:${h}px;background:${c.l}`
        };
      });
      const bonds = [];
      mol.bonds.forEach(([a, b, n]) => {
        const [, x1, y1] = mol.atoms[a], [, x2, y2] = mol.atoms[b];
        const dx = (x2 - x1) * k, dy = (y2 - y1) * k, len = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI, t = Math.max(2, 5 * k);
        (n === 2 ? [-3.5 * k, 3.5 * k] : [0]).forEach(o => {
          const px = -dy / len * o, py = dx / len * o;
          bonds.push({ style: `left:${x1 * k + px}px;top:${y1 * k + py - t / 2}px;width:${len}px;height:${t}px;transform:rotate(${ang}deg)` });
        });
      });
      return Object.assign({ atoms, bonds, box: `width:${mol.w * k}px;height:${mol.h * k}px` }, extra || {});
    };

    // Dopamina: anel catecol com dois OH e cadeia etilamina (sem hidrogênios)
    const ringPt = i => {
      const t = (Math.PI / 3) * i - Math.PI / 2;
      return [56 + 26 * Math.cos(t), 62 + 26 * Math.sin(t)];
    };
    const dAtoms = [];
    for (let i = 0; i < 6; i++) dAtoms.push(['C', ...ringPt(i)]);
    dAtoms.push(['C', 104, 22], ['C', 132, 38], ['N', 160, 22], ['O', 56, 116], ['O', 10, 89]);
    const dBonds = [];
    for (let i = 0; i < 6; i++) dBonds.push([i, (i + 1) % 6, i % 2 === 0 ? 2 : 1]);
    dBonds.push([1, 6, 1], [6, 7, 1], [7, 8, 1], [3, 9, 1], [4, 10, 1]);
    const dopa = build({ w: 172, h: 128, atoms: dAtoms, bonds: dBonds }, 0.36);

    const M = {
      CH4: { w: 96, h: 96, atoms: [['C', 48, 48], ['H', 48, 16], ['H', 48, 80], ['H', 16, 48], ['H', 80, 48]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]] },
      CO2: { w: 128, h: 48, atoms: [['O', 18, 24], ['C', 64, 24], ['O', 110, 24]], bonds: [[0, 1, 2], [1, 2, 2]] },
      NH3: { w: 96, h: 80, atoms: [['N', 48, 28], ['H', 16, 56], ['H', 48, 68], ['H', 80, 56]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]] }
    };
    const floaters = [
      build(M.CH4, 0.5, { pos: 'left:0px;top:20px' }),
      build(M.CO2, 0.42, { pos: 'left:196px;top:150px' }),
      build(M.NH3, 0.45, { pos: 'left:2px;top:156px' })
    ];

    // Organismo pixelado: o = contorno, b = corpo, r = setor doente
    const BODY = [
      '....oooooo....', '...obbbbbbo...', '...obbbbbbo...', '...obbbbbbo...',
      '....obbbbo....', '.....obbo.....', '..oooobboooo..', '.obbbbbbbbbbo.',
      'obbbrrrrrrbbbo', 'obbbrrrrrrbbbo', 'obobrrrrrrbobo', 'obobrrrrrrbobo',
      'obobbbbbbbbobo', 'obo.obbbbo.obo', 'ooo.obbbbo.ooo', '....obbbbo....',
      '....obbobbo...', '....obbobbo...', '....obbobbo...', '....obbobbo...',
      '...obbbobbbo..', '...ooooooooo..'
    ];
    const BC = { o: '#7EF0FF', b: '#1E4E8C', r: '#D83A3A', '.': 'transparent' };
    const body = [];
    BODY.forEach(row => row.split('').forEach(ch => body.push({ bg: BC[ch] })));

    const icon = (rows, color, px) => ({
      grid: `grid-template-columns:repeat(8,${px}px)`,
      cells: rows.join('').split('').map(ch => ({ st: `width:${px}px;height:${px}px;background:${ch === 'o' ? color : 'transparent'}` }))
    });
    const IC = {
      agentes: ['........', '.oo..oo.', '.oo..oo.', '..o..o..', '...oo...', '...oo...', '...oo...', '........'],
      arsenal: ['..oooo..', '...oo...', '...oo...', '..oooo..', '.oooooo.', 'oooooooo', 'oooooooo', '.oooooo.'],
      caso: ['...oo...', '...oo...', '...oo...', 'oooooooo', 'oooooooo', '...oo...', '...oo...', '...oo...'],
      lab: ['o..o..o.', 'o..o..o.', 'o..o..o.', 'o..o..o.', 'oo.oo.oo', 'oo.oo.oo', '........', 'oooooooo'],
      organismo: ['.oo..oo.', 'oooooooo', 'oooooooo', 'oooooooo', '.oooooo.', '..oooo..', '...oo...', '........'],
      menu: ['........', 'oooooooo', '........', '........', 'oooooooo', '........', '........', 'oooooooo'],
      trophy: ['oooooooo', 'oooooooo', '.oooooo.', '..oooo..', '...oo...', '...oo...', '..oooo..', '.oooooo.'],
      book: ['.oooooo.', '.o....o.', '.o.oo.o.', '.o....o.', '.o.oo.o.', '.o....o.', '.oooooo.', '........'],
      medal: ['o......o', '.o....o.', '..oooo..', '.oooooo.', '.oo..oo.', '.oooooo.', '..oooo..', '........'],
      chest: ['........', '.oooooo.', 'oooooooo', 'oooooooo', 'ooo..ooo', 'oooooooo', 'oooooooo', '........']
    };

    const nStars = Math.max(0, Math.min(3, this.props.estrelas ?? 2));
    const stars = ['5 MIN', '10 MIN', '15 MIN'].map((t, i) => ({ t, fill: i < nStars ? '#F2B233' : '#2A2E55' }));
    const selos = this.props.selos ?? true;

    const health = [
      { k: 'F', v: 31, c: '#D83A3A' }, { k: 'M', v: 72, c: '#5BC43A' },
      { k: 'S', v: 64, c: '#2D7FD6' }, { k: 'E', v: 65, c: '#F2C83A' }
    ].map(h => ({ k: h.k, bar: `width:${h.v}%;background:${h.c}` }));

    const TABS = [
      { id: 'agentes', short: 'AGENTES', label: 'Agentes', title: 'Agentes', fase: 'FASE 2', text: 'Elenco da run e do idle, a ficha de cada agente e o desbloqueio com ATP.' },
      { id: 'arsenal', short: 'ARSENAL', label: 'Arsenal', title: 'Arsenal', fase: 'FASE 2', text: 'As 7 armas, seus níveis, as evoluções e os reagentes que as liberam.' },
      { id: 'caso', short: 'CASO', label: 'Caso', title: 'Caso', fase: '', text: '' },
      { id: 'lab', short: 'LAB.', label: 'Laboratório', title: 'Laboratório', fase: 'FASE 3', text: 'Árvores de upgrades permanentes da run e do campo longo.' },
      { id: 'organismo', short: 'ORGANISMO', label: 'Organismo', title: 'Organismo', fase: 'FASE 5', text: 'Os 4 setores de saúde, o efeito de cada um e o reset para o próximo indivíduo.' }
    ];
    const tab = this.state.tab;
    const tabs = TABS.map(t => {
      const on = t.id === tab, mid = t.id === 'caso';
      const base = mid
        ? `flex:1.3;height:${on ? 92 : 84}px;margin-top:-18px;border:4px solid #3A0A0C;`
        : 'flex:1;height:62px;border:3px solid transparent;';
      const bg = on
        ? 'background:#E0702A;box-shadow:inset 0 -5px 0 #9C3F12, inset 0 4px 0 #FFB347;' + (mid ? '' : 'border-color:#3A0A0C;')
        : (mid ? 'background:#B5541C;box-shadow:inset 0 -5px 0 #7A3510, inset 0 4px 0 #E0702A;' : 'background:transparent;');
      return {
        short: t.short, label: t.label,
        st: base + bg,
        txt: on || mid ? 'color:#FFFFFF;text-shadow:0 2px #6E1E0A' : 'color:#C9CCE6',
        icon: icon(IC[t.id], on || mid ? '#FFFFFF' : '#C9CCE6', mid ? 4 : 3),
        badge: selos && t.id === 'agentes' && !on,
        pick: () => this.setState({ tab: t.id })
      };
    });
    const curT = TABS.find(t => t.id === tab);
    const cur = { title: curT.title, text: curT.text, fase: curT.fase, big: icon(IC[tab], '#F4EFE0', 7) };

    return {
      body, bodyMini: body, floaters, dopa, stars, selos, health, tabs, cur,
      isCaso: tab === 'caso', notCaso: tab !== 'caso',
      lanes: [{ top: 'top:6px' }, { top: 'top:22px' }, { top: 'top:12px' }],
      icMenu: icon(IC.menu, '#F4EFE0', 3), icTrophy: icon(IC.trophy, '#F2B233', 3),
      icBook: icon(IC.book, '#F4EFE0', 3), icMedal: icon(IC.medal, '#5B6380', 3),
      icChest: icon(IC.chest, '#F2B233', 4)
    };
  }
}
</script>
</body>
</html>
