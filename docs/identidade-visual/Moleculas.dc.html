<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sprites de moléculas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB347}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 1280px; height: 620px; box-sizing: border-box; padding: 40px 56px; background: #15172E; font-family: 'Pixelify Sans', monospace; color: #F4EFE0; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: baseline; gap: 16px">
    <div style="font-size: 30px; font-weight: 700; color: #FF9A1F; text-shadow: -3px 0 #3A0A0C, 3px 0 #3A0A0C, 0 -3px #3A0A0C, 0 3px #3A0A0C, 0 5px #3A0A0C">MOLÉCULAS</div>
    <div style="font-size: 16px; color: #C9CCE6">Exemplos de estilo: átomo = pixel redondo na cor do elemento, ligação dupla = duas barras</div>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Silkscreen', monospace; font-size: 14px; letter-spacing: 1px; color: {{r.color}}">{{r.label}}</div>
      <div style="display: flex; gap: 20px">
        <sc-for list="{{r.items}}" as="m" hint-placeholder-count="5">
          <div style="width: 210px; height: 200px; box-sizing: border-box; border: 4px solid #07080F; background: #2A2E55; box-shadow: inset 0 -6px 0 #1B1E3A, inset 0 4px 0 #474C85; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px 12px 12px">
            <div style="height: 120px; display: flex; align-items: center; justify-content: center">
              <div style="position: relative; {{m.box}}">
                <sc-for list="{{m.bonds}}" as="b" hint-placeholder-count="4">
                  <div style="position: absolute; transform-origin: 0 50%; background: #0B0A14; {{b.style}}"></div>
                </sc-for>
                <sc-for list="{{m.atoms}}" as="a" hint-placeholder-count="4">
                  <div style="position: absolute; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.outer}}">
                    <div style="position: absolute; inset: 3px; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.inner}}"></div>
                    <div style="position: absolute; {{a.hi}}"></div>
                  </div>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
              <div style="font-size: 18px; font-weight: 700">{{m.name}}</div>
              <div style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #A9AED0">{{m.formula}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const EL = {
      C: { m: '#4A4F5C', d: '#0B0A14', l: '#8A90A0', s: 28 },
      H: { m: '#EDEBDD', d: '#0B0A14', l: '#FFFFFF', s: 16 },
      O: { m: '#E0433A', d: '#0B0A14', l: '#FF9A8A', s: 26 },
      N: { m: '#3F6FE0', d: '#0B0A14', l: '#9FBEFF', s: 26 },
      Cl: { m: '#5BC43A', d: '#0B0A14', l: '#B4F58A', s: 28 },
      S: { m: '#F2C83A', d: '#0B0A14', l: '#FFF2A8', s: 30 }
    };
    const build = (mol, k, extra) => {
      const atoms = mol.atoms.map(([e, x, y]) => {
        const c = EL[e], s = Math.round(c.s * k), h = Math.max(3, Math.round(s / 5));
        return {
          outer: `left:${x * k - s / 2}px;top:${y * k - s / 2}px;width:${s}px;height:${s}px;background:${c.d}`,
          inner: `background:${c.m}`,
          hi: `left:${Math.round(s * 0.24)}px;top:${Math.round(s * 0.24)}px;width:${h}px;height:${h}px;background:${c.l}`
        };
      });
      const bonds = [];
      mol.bonds.forEach(([a, b, n]) => {
        const [, x1, y1] = mol.atoms[a], [, x2, y2] = mol.atoms[b];
        const dx = (x2 - x1) * k, dy = (y2 - y1) * k, len = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI, t = 5 * k;
        (n === 2 ? [-4 * k, 4 * k] : [0]).forEach(o => {
          const px = -dy / len * o, py = dx / len * o;
          bonds.push({ style: `left:${x1 * k + px}px;top:${y1 * k + py - t / 2}px;width:${len}px;height:${t}px;transform:rotate(${ang}deg)` });
        });
      });
      return Object.assign({ atoms, bonds, box: `width:${mol.w * k}px;height:${mol.h * k}px` }, extra);
    };
    const ring = () => {
      const atoms = [], bonds = [];
      for (let i = 0; i < 6; i++) {
        const t = (Math.PI / 3) * i - Math.PI / 2;
        atoms.push(['C', 70 + 30 * Math.cos(t), 70 + 30 * Math.sin(t)]);
      }
      for (let i = 0; i < 6; i++) {
        const t = (Math.PI / 3) * i - Math.PI / 2;
        atoms.push(['H', 70 + 58 * Math.cos(t), 70 + 58 * Math.sin(t)]);
        bonds.push([i, (i + 1) % 6, i % 2 === 0 ? 2 : 1]);
        bonds.push([i, i + 6, 1]);
      }
      return { w: 140, h: 140, atoms, bonds };
    };
    const M = {
      CH4: { w: 96, h: 96, atoms: [['C', 48, 48], ['H', 48, 16], ['H', 48, 80], ['H', 16, 48], ['H', 80, 48]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]] },
      CO2: { w: 128, h: 48, atoms: [['O', 18, 24], ['C', 64, 24], ['O', 110, 24]], bonds: [[0, 1, 2], [1, 2, 2]] },
      H2O: { w: 80, h: 64, atoms: [['O', 40, 22], ['H', 14, 48], ['H', 66, 48]], bonds: [[0, 1, 1], [0, 2, 1]] },
      NH3: { w: 96, h: 80, atoms: [['N', 48, 28], ['H', 16, 56], ['H', 48, 68], ['H', 80, 56]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]] },
      O3: { w: 96, h: 64, atoms: [['O', 18, 46], ['O', 48, 20], ['O', 78, 46]], bonds: [[0, 1, 2], [1, 2, 1]] },
      Cl2: { w: 88, h: 48, atoms: [['Cl', 24, 24], ['Cl', 64, 24]], bonds: [[0, 1, 1]] },
      H2O2: { w: 112, h: 64, atoms: [['H', 12, 48], ['O', 38, 26], ['O', 74, 40], ['H', 100, 18]], bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1]] },
      SO2: { w: 96, h: 64, atoms: [['S', 48, 42], ['O', 18, 20], ['O', 78, 20]], bonds: [[0, 1, 2], [0, 2, 2]] }
    };
    const rows = [
      { label: 'INIMIGOS (EXEMPLOS)', color: '#FF8A7A', items: [
        build(M.CH4, 1.1, { name: 'Metano', formula: 'CH4' }),
        build(M.CO2, 1.2, { name: 'Gás carbônico', formula: 'CO2' }),
        build(M.H2O, 1.3, { name: 'Água', formula: 'H2O' }),
        build(M.NH3, 1.2, { name: 'Amônia', formula: 'NH3' }),
        build(ring(), 0.82, { name: 'Benzeno (elite)', formula: 'C6H6' }) ] },
      { label: 'AGENTES (EXEMPLOS)', color: '#7EF0FF', items: [
        build(M.O3, 1.3, { name: 'Ozônio', formula: 'O3' }),
        build(M.Cl2, 1.4, { name: 'Cloro', formula: 'Cl2' }),
        build(M.H2O2, 1.1, { name: 'Peróxido', formula: 'H2O2' }),
        build(M.SO2, 1.3, { name: 'Dióxido de enxofre', formula: 'SO2' }) ] }
    ];
    return { rows };
  }
}
</script>
</body>
</html>
