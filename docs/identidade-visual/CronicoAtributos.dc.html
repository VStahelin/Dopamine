<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Crônico: atributos e de onde vem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB347}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #D8B47A; background-image: linear-gradient(#CDA56C 3px, transparent 3px), linear-gradient(90deg, #CDA56C 3px, transparent 3px); background-size: 40px 40px; font-family: 'Pixelify Sans', monospace; color: #F4EFE0">
  <div style="position: absolute; inset: 0; background: rgba(7,8,15,0.8)"></div>

  <div style="position: absolute; left: 12px; right: 12px; top: 44px; bottom: 20px; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-size: 32px; font-weight: 700; color: #FF9A1F; text-shadow: -3px 0 #3A0A0C, 3px 0 #3A0A0C, 0 -3px #3A0A0C, 0 3px #3A0A0C, 0 5px #3A0A0C">PAUSADO</div>
      <div style="font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: #C9CCE6">INSULINA · NV 23 · 14:03 · ONDA 3</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button style="height: 44px; font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px; padding: 0; color: #C9CCE6; background: #2A2E55; border: 3px solid #07080F; box-shadow: inset 0 -3px 0 #171A36, inset 0 3px 0 #474C85">ARSENAL</button>
      <button style="height: 44px; font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px; padding: 0; color: #FFFFFF; background: #E0702A; border: 3px solid #3A0A0C; box-shadow: inset 0 -3px 0 #9C3F12, inset 0 3px 0 #FFB347">ATRIBUTOS</button>
      <button style="height: 44px; font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px; padding: 0; color: #C9CCE6; background: #2A2E55; border: 3px solid #07080F; box-shadow: inset 0 -3px 0 #171A36, inset 0 3px 0 #474C85">RUN</button>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 10px; background: #15172E; border: 3px solid #3A0A0C; box-shadow: inset 0 0 0 3px #E0702A, inset 0 0 0 5px #07080F">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 4px">

        <div style="display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px; background: #1B1E3A; border: 2px solid #07080F">
          <sc-for list="{{legend}}" as="l" hint-placeholder-count="8">
            <div style="display: flex; align-items: center; gap: 4px; font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: 1px; color: #C9CCE6">
              <div style="width: 8px; height: 8px; background: {{l.color}}; box-shadow: 0 0 0 1px #07080F"></div>{{l.label}}
            </div>
          </sc-for>
        </div>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: #FFB347; padding-bottom: 2px; border-bottom: 2px solid #2A2E55">{{g.title}}</div>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
              <div style="display: flex; flex-direction: column; gap: 2px; padding: 2px 0 3px">
                <div style="display: flex; align-items: baseline; gap: 6px">
                  <div style="flex: 1; font-size: 13px; font-weight: 600; color: #F4EFE0">{{r.name}}</div>
                  <div style="font-family: 'Silkscreen', monospace; font-size: 8px; color: #8A8EB8">{{r.base}}</div>
                  <div style="width: 64px; text-align: right; font-size: 13px; font-weight: 700; color: {{r.color}}">{{r.value}}</div>
                </div>
                <sc-if value="{{r.hasSources}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-wrap: wrap; gap: 2px 8px; padding-left: 6px">
                    <sc-for list="{{r.sources}}" as="s" hint-placeholder-count="3">
                      <div style="display: flex; align-items: center; gap: 3px; font-family: 'Silkscreen', monospace; font-size: 8px; color: {{s.text}}">
                        <div style="width: 6px; height: 6px; background: {{s.color}}"></div>{{s.label}} {{s.amount}}
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: 1px; color: #C9CCE6; text-align: center">O TETO DA RUN VALE SOBRE O TOTAL</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const SRC = {
      lab: ['LAB.', '#E0702A'],
      organism: ['ORGANISMO', '#FF8AB4'],
      native: ['PERFIL', '#F2C83A'],
      receptor: ['RECEPTOR', '#39D3F0'],
      supplement: ['SUPLEMENTO', '#B072F0'],
      card: ['SINAPSE', '#5B8CFF'],
      mutation: ['MUTAÇÃO', '#E0433A'],
      structure: ['ESTRUTURA', '#C9CCE6']
    };
    const legend = Object.values(SRC).map(([label, color]) => ({ label, color }));
    const G = '#8CF06A', R = '#FF8A7A', N = '#F4EFE0';
    const row = (name, value, base, color, sources) => ({
      name, value, base: base ? `base ${base}` : '', color: color || N,
      hasSources: !!(sources && sources.length),
      sources: (sources || []).map(([k, amount]) => ({
        label: SRC[k][0], color: SRC[k][1], amount,
        text: amount.startsWith('−') && k !== 'native' ? '#FF8A7A' : '#C9CCE6'
      }))
    });
    const groups = [
      { title: 'OFENSIVOS', rows: [
        row('Reatividade', '138%', '100%', G, [['lab', '+10%'], ['receptor', '+20%'], ['supplement', '+3%'], ['card', '+5%']]),
        row('Metabolismo', '−16%', '0%', G, [['receptor', '−16%']]),
        row('Difusão', '100%'),
        row('Chance de catálise', '12%', '5%', G, [['lab', '+2%'], ['mutation', '+5%']])
      ] },
      { title: 'DEFENSIVOS', rows: [
        row('Interações', '88/120', '100', G, [['lab', '+10'], ['organism', '+10']]),
        row('Membrana', '1', '0', G, [['supplement', '+1']])
      ] },
      { title: 'MOBILIDADE E COLETA', rows: [
        row('Mobilidade', '90%', '100%', R, [['organism', '−10%']]),
        row('Raio de coleta', '200%', '100%', G, [['native', '+50%'], ['receptor', '+50%']]),
        row('Sorte', '130%', '100%', G, [['receptor', '+20%'], ['supplement', '+10%']])
      ] },
      { title: 'LEVEL UP E RISCO', rows: [
        row('Rerrolar', '2', '0', G, [['lab', '+1'], ['organism', '+1']]),
        row('Estresse', '10%', '0%', R, [['structure', '+10%']])
      ] }
    ];
    return { legend, groups };
  }
}
</script>
</body>
</html>
