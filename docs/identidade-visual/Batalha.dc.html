<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela de batalha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB347}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #15172E; font-family: 'Pixelify Sans', monospace; color: #F4EFE0; display: flex; flex-direction: column">

  <div style="height: 104px; box-sizing: border-box; padding: 14px 14px 10px; background: #15172E; border-bottom: 4px solid #07080F; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 40px; font-size: 30px; font-weight: 700; color: #7EF0FF; text-align: center; text-shadow: -3px 0 #0A2A3A, 3px 0 #0A2A3A, 0 -3px #0A2A3A, 0 3px #0A2A3A">12</div>
      <div style="flex: 1; border: 4px solid #3A0A0C; background: #B5541C; padding: 3px; box-shadow: inset 0 0 0 2px #F0913A">
        <div style="background: #1B1E3A; padding: 3px; display: flex; gap: 2px">
          <sc-for list="{{pips}}" as="p" hint-placeholder-count="10">
            <div style="flex: 1; height: 14px; background: {{p.fill}}; box-shadow: inset 0 -3px 0 {{p.shade}}"></div>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="width: 22px; height: 22px; position: relative; background: #8A5A0C; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%)">
          <div style="position: absolute; inset: 3px; background: #F2B233; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%)"></div>
          <div style="position: absolute; left: 9px; top: 6px; width: 4px; height: 10px; background: #FFE08A"></div>
        </div>
        <div style="font-size: 20px; font-weight: 700; color: #FFFFFF; text-shadow: 0 3px #07080F">1.250</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #C9CCE6; letter-spacing: 1px">INTERAÇÕES {{n}}/10</div>
      <div style="font-size: 24px; font-weight: 700; color: #FF9A1F; text-shadow: -3px 0 #3A0A0C, 3px 0 #3A0A0C, 0 -3px #3A0A0C, 0 3px #3A0A0C, 0 5px #3A0A0C">ONDA 7</div>
    </div>
  </div>

  <div style="flex: 1; position: relative; display: flex">
    <div style="width: 26px; background-color: #5B6E8E; background-image: linear-gradient(#3E4C68 4px, transparent 4px), linear-gradient(90deg, #3E4C68 4px, transparent 4px); background-size: 26px 22px; border-right: 4px solid #2A3349"></div>
    <div style="flex: 1; position: relative; overflow: hidden; background-color: #D8B47A; background-image: linear-gradient(#CDA56C 3px, transparent 3px), linear-gradient(90deg, #CDA56C 3px, transparent 3px); background-size: 40px 40px">
      <sc-for list="{{enemies}}" as="m" hint-placeholder-count="5">
        <div style="position: absolute; {{m.pos}}">
          <div style="position: relative; {{m.box}}">
            <sc-for list="{{m.bonds}}" as="b" hint-placeholder-count="4">
              <div style="position: absolute; transform-origin: 0 50%; background: #1A1424; {{b.style}}"></div>
            </sc-for>
            <sc-for list="{{m.atoms}}" as="a" hint-placeholder-count="4">
              <div style="position: absolute; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.outer}}">
                <div style="position: absolute; inset: 3px; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.inner}}"></div>
                <div style="position: absolute; {{a.hi}}"></div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-for list="{{shots}}" as="s" hint-placeholder-count="4">
        <div style="position: absolute; width: 8px; height: 16px; background: #7EF0FF; border: 2px solid #0A5A7A; {{s.pos}}"></div>
      </sc-for>
      <div style="position: absolute; left: 196px; top: 286px; font-size: 22px; font-weight: 700; color: #FFFFFF; text-shadow: -3px 0 #8E1616, 3px 0 #8E1616, 0 -3px #8E1616, 0 3px #8E1616">-12</div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #8E1616; border-top: 4px solid #3A0A0C; display: flex; align-items: center; justify-content: center">
        <div style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #FFE0D0; letter-spacing: 2px">BASE</div>
      </div>
    </div>
    <div style="width: 26px; background-color: #5B6E8E; background-image: linear-gradient(#3E4C68 4px, transparent 4px), linear-gradient(90deg, #3E4C68 4px, transparent 4px); background-size: 26px 22px; border-left: 4px solid #2A3349"></div>
  </div>

  <div style="height: 120px; box-sizing: border-box; padding: 12px 14px; background: #B5541C; border-top: 4px solid #3A0A0C; box-shadow: inset 0 3px 0 #F0913A; display: flex; flex-direction: column; gap: 8px">
    <div style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #FFF2DC; letter-spacing: 1px; text-shadow: 0 2px #3A0A0C">POOL DE AGENTES</div>
    <div style="display: flex; gap: 8px; justify-content: space-between">
      <sc-for list="{{agents}}" as="m" hint-placeholder-count="5">
        <div style="width: 62px; height: 62px; box-sizing: border-box; border: 4px solid #3A0A0C; background: #F2D9A8; box-shadow: inset 4px 4px 0 #C9A066; display: flex; align-items: center; justify-content: center; position: relative">
          <div style="position: relative; {{m.box}}">
            <sc-for list="{{m.bonds}}" as="b" hint-placeholder-count="2">
              <div style="position: absolute; transform-origin: 0 50%; background: #1A1424; {{b.style}}"></div>
            </sc-for>
            <sc-for list="{{m.atoms}}" as="a" hint-placeholder-count="3">
              <div style="position: absolute; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.outer}}">
                <div style="position: absolute; inset: 2px; clip-path: polygon(25% 0,75% 0,75% 12.5%,87.5% 12.5%,87.5% 25%,100% 25%,100% 75%,87.5% 75%,87.5% 87.5%,75% 87.5%,75% 100%,25% 100%,25% 87.5%,12.5% 87.5%,12.5% 75%,0 75%,0 25%,12.5% 25%,12.5% 12.5%,25% 12.5%); {{a.inner}}"></div>
                <div style="position: absolute; {{a.hi}}"></div>
              </div>
            </sc-for>
          </div>
          <div style="position: absolute; right: -6px; bottom: -8px; font-size: 14px; font-weight: 700; color: #FFFFFF; text-shadow: -2px 0 #07080F, 2px 0 #07080F, 0 -2px #07080F, 0 2px #07080F">{{m.lvl}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height: 64px; box-sizing: border-box; padding: 10px 14px; background: #15172E; display: flex; align-items: center; gap: 10px">
    <button aria-label="Pausar" style="width: 44px; height: 44px; background: #2A2E55; border: 4px solid #07080F; box-shadow: inset 0 -4px 0 #171A36, inset 0 3px 0 #474C85; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; padding: 0">
      <span style="width: 6px; height: 16px; background: #F4EFE0"></span>
      <span style="width: 6px; height: 16px; background: #F4EFE0"></span>
    </button>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: 'Silkscreen', monospace; font-size: 10px; color: #C9CCE6; letter-spacing: 1px">PROGRESSO DA ONDA</div>
      <div style="height: 12px; border: 3px solid #07080F; background: #1B1E3A">
        <div style="width: 62%; height: 100%; background: #2D7FD6; box-shadow: inset 0 -3px 0 #1A4E8E"></div>
      </div>
    </div>
    <button style="height: 44px; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 18px; color: #FFFFFF; background: #E0702A; border: 4px solid #3A0A0C; box-shadow: inset 0 -4px 0 #9C3F12, inset 0 3px 0 #FFB347; padding: 0 12px; cursor: pointer; text-shadow: 0 2px #6E1E0A">x2</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"interacoes":{"editor":"int","default":7,"min":0,"max":10},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const EL = {
      C: { m: '#4A4F5C', d: '#1C1E25', l: '#8A90A0', s: 28 },
      H: { m: '#EDEBDD', d: '#6E6C5E', l: '#FFFFFF', s: 16 },
      O: { m: '#E0433A', d: '#5A0E10', l: '#FF9A8A', s: 26 },
      N: { m: '#3F6FE0', d: '#13245E', l: '#9FBEFF', s: 26 },
      Cl: { m: '#5BC43A', d: '#1A4E12', l: '#B4F58A', s: 28 },
      S: { m: '#F2C83A', d: '#6E500C', l: '#FFF2A8', s: 30 }
    };
    const build = (mol, k, extra) => {
      const atoms = mol.atoms.map(([e, x, y]) => {
        const c = EL[e], s = Math.round(c.s * k), h = Math.max(2, Math.round(s / 5));
        return {
          outer: `left:${x * k - s / 2}px;top:${y * k - s / 2}px;width:${s}px;height:${s}px;background:${c.d}`,
          inner: `background:${c.m}`,
          hi: `left:${Math.round(s * 0.24)}px;top:${Math.round(s * 0.24)}px;width:${h}px;height:${h}px;background:${c.l}`
        };
      });
      const bonds = [];
      mol.bonds.forEach(([a, b, n]) => {
        const [, x1, y1] = mol.atoms[a], [, x2, y2] = mol.atoms[b];
        const dx = (x2 - x1) * k, dy = (y2 - y1) * k, len = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI, t = Math.max(3, 5 * k);
        (n === 2 ? [-4 * k, 4 * k] : [0]).forEach(o => {
          const px = -dy / len * o, py = dx / len * o;
          bonds.push({ style: `left:${x1 * k + px}px;top:${y1 * k + py - t / 2}px;width:${len}px;height:${t}px;transform:rotate(${ang}deg)` });
        });
      });
      return Object.assign({ atoms, bonds, box: `width:${mol.w * k}px;height:${mol.h * k}px` }, extra || {});
    };
    const ring = () => {
      const atoms = [], bonds = [];
      for (let i = 0; i < 6; i++) {
        const t = (Math.PI / 3) * i - Math.PI / 2;
        atoms.push(['C', 70 + 30 * Math.cos(t), 70 + 30 * Math.sin(t)]);
      }
      for (let i = 0; i < 6; i++) {
        const t = (Math.PI / 3) * i - Math.PI / 2;
        atoms.push(['H', 70 + 58 * Math.cos(t), 70 + 58 * Math.sin(t)]);
        bonds.push([i, (i + 1) % 6, i % 2 === 0 ? 2 : 1]);
        bonds.push([i, i + 6, 1]);
      }
      return { w: 140, h: 140, atoms, bonds };
    };
    const M = {
      CH4: { w: 96, h: 96, atoms: [['C', 48, 48], ['H', 48, 16], ['H', 48, 80], ['H', 16, 48], ['H', 80, 48]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]] },
      CO2: { w: 128, h: 48, atoms: [['O', 18, 24], ['C', 64, 24], ['O', 110, 24]], bonds: [[0, 1, 2], [1, 2, 2]] },
      H2O: { w: 80, h: 64, atoms: [['O', 40, 22], ['H', 14, 48], ['H', 66, 48]], bonds: [[0, 1, 1], [0, 2, 1]] },
      NH3: { w: 96, h: 80, atoms: [['N', 48, 28], ['H', 16, 56], ['H', 48, 68], ['H', 80, 56]], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]] },
      O3: { w: 96, h: 64, atoms: [['O', 18, 46], ['O', 48, 20], ['O', 78, 46]], bonds: [[0, 1, 2], [1, 2, 1]] },
      Cl2: { w: 88, h: 48, atoms: [['Cl', 24, 24], ['Cl', 64, 24]], bonds: [[0, 1, 1]] },
      H2O2: { w: 112, h: 64, atoms: [['H', 12, 48], ['O', 38, 26], ['O', 74, 40], ['H', 100, 18]], bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1]] },
      SO2: { w: 96, h: 64, atoms: [['S', 48, 42], ['O', 18, 20], ['O', 78, 20]], bonds: [[0, 1, 2], [0, 2, 2]] }
    };
    const enemies = [
      build(M.CH4, 0.9, { pos: 'left:136px;top:24px' }),
      build(M.CO2, 0.9, { pos: 'left:24px;top:150px' }),
      build(ring(), 0.85, { pos: 'left:168px;top:186px' }),
      build(M.H2O, 1, { pos: 'left:40px;top:300px' }),
      build(M.NH3, 0.9, { pos: 'left:120px;top:420px' })
    ];
    const shots = [
      { pos: 'left:66px;top:520px' }, { pos: 'left:226px;top:340px' },
      { pos: 'left:232px;top:430px' }, { pos: 'left:286px;top:500px' }
    ];
    const agents = [
      build(M.O3, 0.5, { lvl: '+3' }), build(M.Cl2, 0.55, { lvl: '+1' }),
      build(M.H2O2, 0.42, { lvl: '+2' }), build(M.SO2, 0.5, { lvl: '+1' }),
      build(M.H2O, 0.55, { lvl: '' })
    ];
    const n = Math.max(0, Math.min(10, this.props.interacoes ?? 7));
    const pips = Array.from({ length: 10 }, (_, i) => i < n
      ? { fill: '#D83A3A', shade: '#8E1616' }
      : { fill: '#2A2E55', shade: '#1B1E3A' });
    return { enemies, shots, agents, pips, n };
  }
}
</script>
</body>
</html>
