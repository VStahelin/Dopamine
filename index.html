<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15172E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Farmaco Battle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15172e;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /*
       * Tela de carregamento: aparece antes de qualquer script, enquanto o jogo baixa, e volta
       * por cima de tudo durante uma atualização (src/game/ui/loader.ts). Só CSS, sem as fontes
       * do jogo, que ainda não chegaram.
       */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #15172e;
        font-family: 'Courier New', monospace;
        font-weight: 700;
        color: #f4efe0;
        text-align: center;
        transition: opacity 0.25s;
      }
      #loader.overlay {
        background: rgba(7, 8, 15, 0.88);
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loader .logo {
        font-size: 30px;
        letter-spacing: 2px;
        color: #ff9a1f;
        text-shadow:
          -3px 0 #3a0a0c,
          3px 0 #3a0a0c,
          0 -3px #3a0a0c,
          0 4px #3a0a0c;
      }
      #loader .logo span {
        color: #6cd43f;
      }
      #loader .molecule {
        position: relative;
        width: 72px;
        height: 72px;
        animation: spin 1.6s steps(8) infinite;
      }
      #loader .molecule i {
        position: absolute;
        width: 18px;
        height: 18px;
        border: 3px solid #1a1424;
        background: #4a4f5c;
      }
      #loader .molecule i:nth-child(1) {
        left: 24px;
        top: 0;
        background: #e0433a;
      }
      #loader .molecule i:nth-child(2) {
        left: 48px;
        top: 24px;
      }
      #loader .molecule i:nth-child(3) {
        left: 24px;
        top: 48px;
        background: #3f6fe0;
      }
      #loader .molecule i:nth-child(4) {
        left: 0;
        top: 24px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loader .bar {
        width: min(280px, 80vw);
        height: 16px;
        border: 3px solid #3a0a0c;
        background: #b5541c;
        padding: 3px;
        box-sizing: border-box;
      }
      #loader .bar div {
        height: 100%;
        width: 30%;
        background: #39d3f0;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      #loader .bar.known div {
        animation: none;
        transition: width 0.2s;
      }
      @keyframes slide {
        from {
          margin-left: 0;
        }
        to {
          margin-left: 70%;
        }
      }
      #loader .status {
        font-size: 15px;
        letter-spacing: 1px;
      }
      #loader .detail {
        max-width: 300px;
        font-size: 12px;
        font-weight: 400;
        color: #c9cce6;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loader" role="status" aria-live="polite">
      <div class="logo">FARMACO <span>BATTLE</span></div>
      <div class="molecule" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="bar"><div></div></div>
      <div class="status">BAIXANDO O JOGO...</div>
      <div class="detail">
        Na primeira vez demora um pouco. Depois o jogo fica guardado e abre até sem internet.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
