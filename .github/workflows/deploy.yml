# Deploy de uma versão (decisão 0017): só roda quando uma tag vX.Y.Z é enviada
# (npm version patch|minor|major && git push --follow-tags). Commits comuns só passam pelo CI.
#
# 1. Roda o check completo e gera a build.
# 2. Publica no GitHub Pages (https://vstahelin.github.io/Dopamine/).
# 3. Aciona o deploy no Render pelo deploy hook (segredo RENDER_DEPLOY_HOOK_URL), na mesma versão.
name: Deploy de versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # O Pages serve o jogo em /Dopamine/.
      - run: npm run build
        env:
          BASE_PATH: /Dopamine/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Aciona o deploy no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Segredo RENDER_DEPLOY_HOOK_URL não configurado: deploy no Render pulado."
            exit 0
          fi
          curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}"
