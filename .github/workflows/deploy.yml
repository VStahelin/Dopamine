# Deploy de uma versão (decisões 0017 e 0018): só roda quando uma tag vX.Y.Z é enviada
# (npm version patch|minor|major && git push --follow-tags). Commits comuns só passam pelo CI.
#
# 1. Roda o check completo e gera a build.
# 2. Publica no GitHub Pages (https://vstahelin.github.io/Dopamine/), onde o jogo roda.
name: Deploy de versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # O Pages serve o jogo em /Dopamine/.
      - run: npm run build
        env:
          BASE_PATH: /Dopamine/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
